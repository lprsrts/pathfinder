# The Linux and Windows builds of a release. scripts/release.sh builds the Mac
# one locally (signed and notarised), downloads these artifacts from the run
# for the same commit, puts them in the signed manifest and publishes them.
# Integrity comes from that manifest's sha256 for every archive.
name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild@0.20.1
      # Linked against glibc 2.28, so it runs on distributions older than
      # the runner (Debian 10, RHEL 8, Ubuntu 18.10 and later).
      - working-directory: app
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)"
          mkdir pkg
          cp "app/target/${{ matrix.target }}/release/pathfinder" pkg/
          cp LICENSE NOTICE pkg/ && cp -R LICENSES pkg/
          tar -czf "pathfinder-$version-${{ matrix.target }}.tar.gz" -C pkg pathfinder LICENSE NOTICE LICENSES
      - uses: actions/upload-artifact@v4
        with:
          name: pathfinder-${{ matrix.target }}
          path: pathfinder-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # aws-lc's x86_64 assembly is built with NASM.
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1
      - working-directory: app
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item "app/target/${{ matrix.target }}/release/pathfinder.exe" pkg/
          Copy-Item LICENSE, NOTICE pkg/
          Copy-Item -Recurse LICENSES pkg/
          # A .tar.gz like every other build: `pathfinder update` unpacks
          # that format in-process. Windows' own tar.exe (bsdtar) writes it.
          & "$env:SystemRoot\System32\tar.exe" -czf "pathfinder-$version-${{ matrix.target }}.tar.gz" -C pkg pathfinder.exe LICENSE NOTICE LICENSES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pathfinder-${{ matrix.target }}
          path: pathfinder-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
