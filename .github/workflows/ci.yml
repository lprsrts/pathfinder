name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        crate: [app, schema, collector]
        # The collector is a Linux server; schema/ still builds everywhere.
        exclude:
          - os: windows-latest
            crate: collector
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
        # Git Bash on Windows, so every step reads the same on each OS.
        shell: bash
    steps:
      # Keep LF line endings on Windows, so `cargo fmt --check` and the
      # tests' text fixtures see the files as committed.
      - if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # aws-lc-sys (rustls's crypto) assembles its x86_64 code with NASM.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      # The agent's sandbox on Linux is bubblewrap. Ubuntu 24.04 lets
      # AppArmor refuse unprivileged user namespaces, which bwrap needs.
      - if: runner.os == 'Linux' && matrix.crate == 'app'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # On Linux and macOS the sandbox tests must run, not skip: a missing
      # sandbox fails them.
      - run: cargo test --locked
        env:
          PATHFINDER_REQUIRE_SANDBOX_TESTS: ${{ (matrix.crate == 'app' && runner.os != 'Windows') && '1' || '' }}
