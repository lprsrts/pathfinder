<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 969 640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#16181d"/>
<text x="22.4" y="27.0" fill="#c678dd" xml:space="preserve">• </text>
<text x="39.2" y="27.0" fill="#e5c07b" xml:space="preserve">retry.py</text>
<text x="106.4" y="27.0" fill="#d7dae0" xml:space="preserve"> uses </text>
<text x="156.8" y="27.0" fill="#e5c07b" xml:space="preserve">random.uniform(0, delay)</text>
<text x="358.4" y="27.0" fill="#d7dae0" xml:space="preserve"> to spread retries out. If many      </text>
<text x="669.2" y="27.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="27.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Thread  </text>
<text x="753.2" y="27.0" fill="#d7dae0" font-weight="600" xml:space="preserve">quick check</text>
<text x="14.0" y="44.0" fill="#d7dae0" xml:space="preserve">   clients fail at the same time and all sleep for exactly </text>
<text x="509.6" y="44.0" fill="#e5c07b" xml:space="preserve">delay</text>
<text x="551.6" y="44.0" fill="#d7dae0" xml:space="preserve">, they’ll     </text>
<text x="669.2" y="44.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="44.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Check how jitter spreads out</text>
<text x="14.0" y="61.0" fill="#d7dae0" xml:space="preserve">   retry together, potentially overloading the recovering service and failing </text>
<text x="669.2" y="61.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="61.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">clients that failed at the same</text>
<text x="14.0" y="78.0" fill="#d7dae0" xml:space="preserve">   again. This is the </text>
<text x="198.8" y="78.0" fill="#d7dae0" font-weight="600" xml:space="preserve">thundering herd</text>
<text x="324.8" y="78.0" fill="#d7dae0" xml:space="preserve"> problem.                                </text>
<text x="669.2" y="78.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="78.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">moment during retries</text>
<text x="669.2" y="95.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="112.0" fill="#d7dae0" xml:space="preserve">   The code uses </text>
<text x="156.8" y="112.0" fill="#d7dae0" font-weight="600" xml:space="preserve">exponential backoff with full jitter</text>
<text x="459.2" y="112.0" fill="#d7dae0" xml:space="preserve">: </text>
<text x="476.0" y="112.0" fill="#e5c07b" xml:space="preserve">delay</text>
<text x="518.0" y="112.0" fill="#d7dae0" xml:space="preserve"> is the upper     </text>
<text x="669.2" y="112.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="112.0" fill="#e5c07b" xml:space="preserve">A candidate waits for your</text>
<text x="14.0" y="129.0" fill="#d7dae0" xml:space="preserve">   bound, not the actual wait. With the defaults, the first retry waits       </text>
<text x="669.2" y="129.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="129.0" fill="#e5c07b" xml:space="preserve">verdict: is it right, and why?</text>
<text x="14.0" y="146.0" fill="#d7dae0" xml:space="preserve">   anywhere from 0 to 0.2 seconds, the second from 0 to 0.4 seconds, and so   </text>
<text x="669.2" y="146.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="163.0" fill="#d7dae0" xml:space="preserve">   on, with the upper bound capped at 10 seconds. The retry window grows      </text>
<text x="669.2" y="163.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="163.0" fill="#d7dae0" font-weight="600" xml:space="preserve">Parts</text>
<text x="14.0" y="180.0" fill="#d7dae0" xml:space="preserve">   after each failure, but any individual wait can be shorter than the        </text>
<text x="669.2" y="180.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="180.0" fill="#56b6c2" xml:space="preserve">▶ </text>
<text x="702.8" y="180.0" fill="#d7dae0" font-weight="600" xml:space="preserve">Retry timing after a shared</text>
<text x="14.0" y="197.0" fill="#d7dae0" xml:space="preserve">   previous one.                                                              </text>
<text x="669.2" y="197.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="702.8" y="197.0" fill="#d7dae0" font-weight="600" xml:space="preserve">failure</text>
<text x="669.2" y="214.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="22.4" y="231.0" fill="#98c379" font-weight="600" xml:space="preserve">› </text>
<text x="39.2" y="231.0" fill="#d7dae0" font-weight="600" xml:space="preserve">I think I get it now: the jitter spreads out clients that failed at the</text>
<text x="669.2" y="231.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="231.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">/why  your record</text>
<text x="39.2" y="248.0" fill="#d7dae0" font-weight="600" xml:space="preserve">same moment.</text>
<text x="669.2" y="248.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="686.0" y="248.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">/map  the plan</text>
<text x="669.2" y="265.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="22.4" y="282.0" fill="#98c379" xml:space="preserve">✓ </text>
<text x="39.2" y="282.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Read retry.py (lines 1–100)</text>
<text x="669.2" y="282.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="669.2" y="299.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="22.4" y="316.0" fill="#c678dd" xml:space="preserve">• </text>
<text x="39.2" y="316.0" fill="#d7dae0" xml:space="preserve">Then a quick one to make it stick:                                         </text>
<text x="669.2" y="316.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="669.2" y="333.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="22.4" y="350.0" fill="#98c379" xml:space="preserve">✓ </text>
<text x="39.2" y="350.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Read 1 file, listed 1 folder</text>
<text x="669.2" y="350.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="669.2" y="367.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="22.4" y="384.0" fill="#c678dd" xml:space="preserve">• </text>
<text x="39.2" y="384.0" fill="#d7dae0" xml:space="preserve">Candidate for </text>
<text x="156.8" y="384.0" fill="#d7dae0" font-weight="600" xml:space="preserve">Retry timing after a shared failure</text>
<text x="450.8" y="384.0" fill="#d7dae0" xml:space="preserve">:                         </text>
<text x="669.2" y="384.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="669.2" y="401.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="418.0" fill="#d7dae0" xml:space="preserve">   After each failure with a retry left, retry.py computes a ceiling of       </text>
<text x="669.2" y="418.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="435.0" fill="#d7dae0" xml:space="preserve">   min(cap, base × 2^attempt), starting at attempt 0. With full jitter, each  </text>
<text x="669.2" y="435.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="452.0" fill="#d7dae0" xml:space="preserve">   client draws its own wait uniformly from zero to that ceiling. Suppose A   </text>
<text x="669.2" y="452.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="469.0" fill="#d7dae0" xml:space="preserve">   and B both fail at t = 0 and their first retries also fail immediately.    </text>
<text x="669.2" y="469.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="486.0" fill="#d7dae0" xml:space="preserve">   With the defaults, A draws waits of 0.04 s and 0.30 s, and B draws 0.16 s  </text>
<text x="669.2" y="486.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="503.0" fill="#d7dae0" xml:space="preserve">   and 0.22 s. A retries at t = 0.04 s and 0.30 s; B retries at t = 0.16 s    </text>
<text x="669.2" y="503.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="520.0" fill="#d7dae0" xml:space="preserve">   and 0.22 s. If both clients instead waited the full ceiling each round,    </text>
<text x="669.2" y="520.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="537.0" fill="#d7dae0" xml:space="preserve">   they would retry together at t = 0.20 s and 0.60 s.                        </text>
<text x="669.2" y="537.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="669.2" y="554.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="571.0" fill="#d7dae0" xml:space="preserve">   Is it right? Say why.                                                      </text>
<text x="669.2" y="571.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">│</text>
<text x="14.0" y="588.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">── retry-service · quick check ─────────────────────────────────────────────────────────────────────────────────</text>
<text x="14.0" y="605.0" fill="#98c379" font-weight="600" xml:space="preserve">›</text>
<text x="30.8" y="605.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Right or wrong, and why? Or just ask your next question</text>
<text x="22.4" y="622.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">Enter send · Alt+Enter line · ^P settings · ^O threads · F1 keys</text>
<text x="627.2" y="622.0" fill="#d7dae0" opacity="0.6" xml:space="preserve">GPT-6-Luna · GPT-6.2-Sol · checks light</text>
</svg>