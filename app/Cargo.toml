[package]
name = "pathfinder"
version = "0.3.3"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A terminal work agent that makes sure you understand the work you do with AI"
repository = "https://github.com/lprsrts/pathfinder"
homepage = "https://pathfinder.lprsrts.com"
readme = "../README.md"
authors = ["Alper Sarıtaş"]

[dependencies]
agent-client-protocol = { version = "5.5.1", features = ["stdio"] }
anyhow = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
rpassword = "7"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.3"
pathfinder-schema = { path = "../schema" }
ed25519-dalek = "2"
